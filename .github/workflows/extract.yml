
name: Extract Any ZIP File

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract all ZIP files
        shell: bash
        run: |
          set -e

          mapfile -d '' ZIP_FILES < <(
            find . -type f -iname "*.zip" \
              -not -path "./.git/*" \
              -print0 | sort -z
          )

          if [ ${#ZIP_FILES[@]} -eq 0 ]; then
            echo "ERROR: No ZIP files found!"
            exit 1
          fi

          TEMP=$(mktemp -d)

          for ZIP in "${ZIP_FILES[@]}"; do
            echo "Extracting: $ZIP"

            mkdir -p "$TEMP/unpack"
            unzip -o "$ZIP" -d "$TEMP/unpack"

            # Handle ZIPs containing one main project folder
            shopt -s dotglob nullglob
            ITEMS=("$TEMP/unpack"/*)

            if [ ${#ITEMS[@]} -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
              SOURCE="${ITEMS[0]}"
            else
              SOURCE="$TEMP/unpack"
            fi

            cp -a "$SOURCE"/. .

            rm -f "$ZIP"
            rm -rf "$TEMP/unpack"
          done

          rm -rf "$TEMP"

          echo "All ZIP files extracted successfully!"

      - name: Commit updated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Extract and update project from ZIP files"
          git push
